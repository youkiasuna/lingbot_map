<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live 3D Scene</title>
<style>
:root{color-scheme:light;--bg:#eef2f4;--panel:#fff;--text:#172026;--muted:#65717a;--line:#ccd5db;--accent:#087f8c;--warn:#b36b00}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
#status{font-size:13px;color:var(--muted);overflow-wrap:anywhere;text-align:right}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;height:calc(100% - 58px);padding:14px}
#view{width:100%;height:100%;min-height:420px;background:#d7dee2;border:1px solid var(--line);border-radius:8px}
.panel{align-self:start;display:grid;gap:13px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
label{display:grid;gap:6px;color:var(--muted);font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
button{height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font:inherit;cursor:pointer}
button:hover{border-color:var(--accent)}
.stat{display:grid;gap:3px;padding-top:9px;border-top:1px solid var(--line)}
.stat span{font-size:12px;color:var(--muted)}
.stat strong{font-size:14px;overflow-wrap:anywhere}
@media(max-width:820px){main{grid-template-columns:1fr;height:auto;overflow:auto}#view{height:62vh}.panel{align-self:stretch}}
</style>
</head>
<body>
<header><h1>Live 3D Scene</h1><span id="status">waiting</span></header>
<main>
  <canvas id="view"></canvas>
  <aside class="panel">
    <label>Yaw <input id="yaw" type="range" min="-180" max="180" value="25" step="1"></label>
    <label>Pitch <input id="pitch" type="range" min="45" max="88" value="72" step="1"></label>
    <label>Point Size <input id="pointSize" type="range" min="1" max="5" value="2" step="0.5"></label>
    <button id="fit">置中</button>
    <div id="stats"></div>
  </aside>
</main>
<script>
const canvas=document.getElementById("view"),ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status"),statsEl=document.getElementById("stats");
const yawEl=document.getElementById("yaw"),pitchEl=document.getElementById("pitch"),sizeEl=document.getElementById("pointSize");
const state={scene:null,lastUpdate:null,center:null,scale:null,error:null};
function stat(label,value){return `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d))}
function ensureView(){
  const b=state.scene&&state.scene.bounds;if(!b)return;
  if(!state.center){state.center={x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2,z:(b.minZ+b.maxZ)/2}}
  const span=Math.max(b.maxX-b.minX,b.maxZ-b.minZ,b.maxY-b.minY,0.5);
  if(!state.scale)state.scale=Math.min(canvas.width,canvas.height)*0.72/span;
}
function draw(){
  resize();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#d7dee2";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!state.scene||!state.scene.points){ctx.fillStyle="#65717a";ctx.font=`${14*(devicePixelRatio||1)}px system-ui`;ctx.fillText("等待第一批 3D 場景輸出",24,36);return}
  ensureView();
  const yaw=Number(yawEl.value)*Math.PI/180,pitch=Number(pitchEl.value)*Math.PI/180;
  const c=state.center,scale=state.scale,pointSize=Number(sizeEl.value)*(devicePixelRatio||1);
  const projected=state.scene.points.map(p=>{
    const x=p[0]-c.x,y=p[1]-c.y,z=p[2]-c.z;
    const xr=x*Math.cos(yaw)-z*Math.sin(yaw);
    const zr=x*Math.sin(yaw)+z*Math.cos(yaw);
    const sy=zr*Math.sin(pitch)-(-y)*Math.cos(pitch);
    return {x:canvas.width/2+xr*scale,y:canvas.height/2-sy*scale,depth:zr,c:`rgb(${p[3]},${p[4]},${p[5]})`};
  });
  projected.sort((a,b)=>a.depth-b.depth);
  for(const p of projected){ctx.fillStyle=p.c;ctx.fillRect(p.x-pointSize/2,p.y-pointSize/2,pointSize,pointSize)}
  statsEl.innerHTML=
    stat("frames",state.scene.frame_count||0)+
    stat("update",state.scene.update_index||0)+
    stat("sampled points",(state.scene.sampled_points||0).toLocaleString())+
    stat("source vertices",(state.scene.source_vertices||0).toLocaleString())+
    stat("sample stride",state.scene.sample_stride||1);
}
async function poll(){
  try{
    const r=await fetch("/api/live/scene",{cache:"no-store"});
    const payload=await r.json();
    if(!r.ok)throw Error(payload.message||r.statusText);
    const scene=payload.scene;
    if(!state.scene||scene.update_index!==state.lastUpdate){
      state.scene=scene;state.lastUpdate=scene.update_index;state.center=null;state.scale=null;draw();
    }
    statusEl.textContent=`更新 ${scene.update_index||0} / ${new Date((scene.generated_at_unix||0)*1000).toLocaleTimeString()}`;
  }catch(e){statusEl.textContent=e.message}
}
yawEl.oninput=draw;pitchEl.oninput=draw;sizeEl.oninput=draw;
document.getElementById("fit").onclick=()=>{state.center=null;state.scale=null;draw()};
addEventListener("resize",()=>{state.scale=null;draw()});
draw();poll();setInterval(poll,2000);
</script>
</body>
</html>
