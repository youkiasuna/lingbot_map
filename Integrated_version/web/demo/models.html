<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LingBot-MAP 3D Models</title>
<style>html,body{margin:0;height:100%;font-family:system-ui,sans-serif;background:#071018;color:#eaf7fa}body{display:grid;grid-template-rows:auto 1fr}header{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#102936;border-bottom:1px solid #29404c}h1{font-size:17px;margin:0}label{font-size:13px;color:#b9d0d7}select{margin-left:8px;padding:7px 10px;border:1px solid #477181;border-radius:6px;background:#071018;color:#eaf7fa;font:inherit}#info{font-size:12px;color:#9fb8c0}iframe{width:100%;height:100%;border:0}</style></head>
<body><header><h1>LingBot-MAP 3D 模型比較</h1><label>模型<select id="model"><option value="clean">clean 清理版</option><option value="calibrated">calibrated 校正版</option><option value="calibrated_y">calibrated_y Y 軸校正版</option><option value="calibrated_z">calibrated_z Z 軸校正版</option><option value="navigation">navigation 導航分類版</option><option value="rebuilt" selected>rebuilt_colored_map 原始重建版</option><option value="initial">initial 初始版本</option></select></label><span id="info"></span></header><iframe id="viewer" title="3D model viewer"></iframe>
<script>
const descriptions={clean:"清理後點雲，雜訊較少，現在的主要參考版本。",calibrated:"由 clean 經地面校正的版本。",calibrated_y:"Y 軸地面校正版本，與目前 2D 導航座標一致。",calibrated_z:"Z 軸校正版本，用來比較座標方向。",navigation:"地面、障礙物、未知區域分類結果。",rebuilt:"LingBot-MAP 原始重建彩色點雲，雜訊較多。",initial:"早期地面校正 viewer。"};
const s=document.getElementById("model"),v=document.getElementById("viewer"),i=document.getElementById("info");function load(){v.src="/3d-viewer?model="+encodeURIComponent(s.value);i.textContent=descriptions[s.value]}s.onchange=load;load();
</script></body></html>
