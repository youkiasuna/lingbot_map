<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live TSDF Mesh</title>
<style>
:root{color-scheme:light;--bg:#eef2f4;--panel:#fff;--text:#172026;--muted:#65717a;--line:#ccd5db;--accent:#087f8c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}
header{height:58px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
#status{font-size:13px;color:var(--muted);text-align:right;overflow-wrap:anywhere}
main{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;height:calc(100% - 58px);padding:14px}
#view{width:100%;height:100%;min-height:420px;background:#d7dee2;border:1px solid var(--line);border-radius:8px}
.panel{align-self:start;display:grid;gap:13px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
label{display:grid;gap:6px;color:var(--muted);font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
a,button{height:36px;display:inline-grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font:inherit;text-decoration:none;cursor:pointer}
a:hover,button:hover{border-color:var(--accent)}
.stat{display:grid;gap:3px;padding-top:9px;border-top:1px solid var(--line)}
.stat span{font-size:12px;color:var(--muted)}
.stat strong{font-size:14px;overflow-wrap:anywhere}
@media(max-width:820px){main{grid-template-columns:1fr;height:auto;overflow:auto}#view{height:62vh}.panel{align-self:stretch}}
</style>
</head>
<body>
<header><h1>Live TSDF Mesh</h1><span id="status">waiting</span></header>
<main>
  <canvas id="view"></canvas>
  <aside class="panel">
    <label>Yaw <input id="yaw" type="range" min="-180" max="180" value="25" step="1"></label>
    <label>Pitch <input id="pitch" type="range" min="45" max="88" value="72" step="1"></label>
    <label>Opacity <input id="opacity" type="range" min="0.15" max="1" value="0.72" step="0.05"></label>
    <button id="fit">置中</button>
    <a href="/api/live/mesh.ply" target="_blank">下載 PLY Mesh</a>
    <div id="stats"></div>
  </aside>
</main>
<script>
const canvas=document.getElementById("view"),ctx=canvas.getContext("2d");
const statusEl=document.getElementById("status"),statsEl=document.getElementById("stats");
const yawEl=document.getElementById("yaw"),pitchEl=document.getElementById("pitch"),opacityEl=document.getElementById("opacity");
const state={mesh:null,lastUpdate:null,center:null,scale:null};
function stat(label,value){return `<div class="stat"><span>${label}</span><strong>${value}</strong></div>`}
function resize(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=Math.max(1,Math.floor(r.width*d));canvas.height=Math.max(1,Math.floor(r.height*d))}
function ensureView(){
  const b=state.mesh&&state.mesh.bounds;if(!b)return;
  if(!state.center)state.center={x:(b.minX+b.maxX)/2,y:(b.minY+b.maxY)/2,z:(b.minZ+b.maxZ)/2};
  const span=Math.max(b.maxX-b.minX,b.maxZ-b.minZ,b.maxY-b.minY,0.5);
  if(!state.scale)state.scale=Math.min(canvas.width,canvas.height)*0.72/span;
}
function draw(){
  resize();ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle="#d7dee2";ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!state.mesh||!state.mesh.vertices){ctx.fillStyle="#65717a";ctx.font=`${14*(devicePixelRatio||1)}px system-ui`;ctx.fillText("等待 TSDF mesh 輸出",24,36);return}
  ensureView();
  const yaw=Number(yawEl.value)*Math.PI/180,pitch=Number(pitchEl.value)*Math.PI/180,c=state.center,scale=state.scale;
  const projected=state.mesh.vertices.map(v=>{
    const x=v[0]-c.x,y=v[1]-c.y,z=v[2]-c.z;
    const xr=x*Math.cos(yaw)-z*Math.sin(yaw);
    const zr=x*Math.sin(yaw)+z*Math.cos(yaw);
    const sy=zr*Math.sin(pitch)-(-y)*Math.cos(pitch);
    return {x:canvas.width/2+xr*scale,y:canvas.height/2-sy*scale,depth:zr,c:[v[3],v[4],v[5]]};
  });
  const faces=state.mesh.faces.map(f=>{
    const a=projected[f[0]],b=projected[f[1]],c=projected[f[2]];
    return {f,a,b,c,depth:(a.depth+b.depth+c.depth)/3};
  }).sort((p,q)=>p.depth-q.depth);
  ctx.lineWidth=Math.max(0.4,(devicePixelRatio||1)*0.45);
  for(const face of faces){
    const r=Math.round((face.a.c[0]+face.b.c[0]+face.c.c[0])/3),g=Math.round((face.a.c[1]+face.b.c[1]+face.c.c[1])/3),b=Math.round((face.a.c[2]+face.b.c[2]+face.c.c[2])/3);
    ctx.beginPath();ctx.moveTo(face.a.x,face.a.y);ctx.lineTo(face.b.x,face.b.y);ctx.lineTo(face.c.x,face.c.y);ctx.closePath();
    ctx.fillStyle=`rgba(${r},${g},${b},${opacityEl.value})`;ctx.fill();
    ctx.strokeStyle="rgba(20,30,36,.16)";ctx.stroke();
  }
  statsEl.innerHTML=
    stat("frames",state.mesh.frame_count||0)+
    stat("update",state.mesh.update_index||0)+
    stat("preview vertices",(state.mesh.vertices.length||0).toLocaleString())+
    stat("preview faces",(state.mesh.faces.length||0).toLocaleString())+
    stat("source faces",(state.mesh.source_faces||0).toLocaleString());
}
async function poll(){
  try{
    const r=await fetch("/api/live/mesh",{cache:"no-store"});
    const payload=await r.json();
    if(!r.ok)throw Error(payload.message||r.statusText);
    const mesh=payload.mesh;
    if(!state.mesh||mesh.update_index!==state.lastUpdate){
      state.mesh=mesh;state.lastUpdate=mesh.update_index;state.center=null;state.scale=null;draw();
    }
    statusEl.textContent=`更新 ${mesh.update_index||0} / ${new Date((mesh.generated_at_unix||0)*1000).toLocaleTimeString()}`;
  }catch(e){statusEl.textContent=e.message}
}
yawEl.oninput=draw;pitchEl.oninput=draw;opacityEl.oninput=draw;
document.getElementById("fit").onclick=()=>{state.center=null;state.scale=null;draw()};
addEventListener("resize",()=>{state.scale=null;draw()});
draw();poll();setInterval(poll,2500);
</script>
</body>
</html>
