<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分類 3D 可通行性模型</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018;color:#eaf7fa;font-family:system-ui,sans-serif}#viewer{width:100%;height:100%}#panel{position:fixed;z-index:2;top:16px;left:16px;padding:14px 16px;border:1px solid #29404c;border-radius:8px;background:rgba(7,16,24,.92);font-size:13px;line-height:1.7}h1{margin:0 0 8px;font-size:17px}.item{display:flex;align-items:center;gap:7px}.dot{width:12px;height:12px;border-radius:50%;display:inline-block}.hint{margin-top:8px;color:#a8c0ca;font-size:11px}</style></head>
<body><div id="panel"><h1>3D 可通行性分類</h1><div class="item"><i class="dot" style="background:#32c96b"></i>地板 / 可通行</div><div class="item"><i class="dot" style="background:#ed4b4b"></i>牆壁與障礙物</div><div class="item"><i class="dot" style="background:#f0c52e"></i>未知 / 資料不足</div><div class="hint">使用 rebuilt_colored_map 分類後再投影成 2D map<br>拖曳旋轉，滾輪縮放</div><div id="status">載入中...</div></div><div id="viewer"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from "three";import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";import {PLYLoader} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/PLYLoader.js";
const root=document.getElementById("viewer"),status=document.getElementById("status"),scene=new THREE.Scene();scene.background=new THREE.Color(0x071018);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.01,1000);camera.position.set(3,2.5,4);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);root.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,0,0);controls.update();
scene.add(new THREE.GridHelper(8,40,0x31505a,0x1b3038),new THREE.AxesHelper(1.5));
const specs=[["floor","地板",0x32c96b],["obstacle","牆壁/障礙物",0xed4b4b],["unknown","未知",0xf0c52e]],loader=new PLYLoader();let loaded=0,total=0;
for(const [name,label,color] of specs){loader.load("/3d-ply?source=rebuilt&name="+name,g=>{g.computeVertexNormals();const mat=new THREE.PointsMaterial({size:.018,color,transparent:name==="unknown",opacity:name==="unknown"?.55:1});scene.add(new THREE.Points(g,mat));loaded++;status.textContent="已載入 "+loaded+"/3 類別";if(loaded===3)fit()},undefined,e=>{status.textContent=label+" 載入失敗"});}
function fit(){const box=new THREE.Box3().setFromObject(scene),center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),radius=Math.max(size.x,size.y,size.z);controls.target.copy(center);camera.position.copy(center).add(new THREE.Vector3(radius*.9,radius*.65,radius*.9));camera.near=Math.max(.01,radius/1000);camera.far=radius*10;camera.updateProjectionMatrix();controls.update()}
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
