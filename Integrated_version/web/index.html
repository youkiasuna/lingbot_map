<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live 3D Mapping Monitor</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div>
        <h1>Live 3D Mapping Monitor</h1>
        <span id="stateText">等待即時建圖</span>
      </div>
      <button id="refreshBtn" type="button">立即更新</button>
    </header>
    <section class="layout">
      <section id="viewer" aria-label="即時三維點雲"></section>
      <aside class="panel">
        <div><span>模式</span><strong id="modeText">等待</strong></div>
        <div><span>Map version</span><strong id="versionText">-</strong></div>
        <div><span>點雲數量</span><strong id="pointsText">-</strong></div>
        <div><span>處理 windows</span><strong id="windowsText">-</strong></div>
        <div><span>輸入影格</span><strong id="framesText">-</strong></div>
        <div><span>最後 window</span><strong id="windowText">-</strong></div>
        <div><span>錯誤</span><strong id="errorText">無</strong></div>
        <p class="hint">滑鼠拖曳旋轉、滾輪縮放。此頁面只監看建圖，不控制車輛。</p>
      </aside>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
